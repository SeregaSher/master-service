<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#135e63" />
    <title>WP Service Master</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <script>
      window.__WP_VERSION__ = "v5";
      window.__wpLog = [];
      window.__wpPushLog = function (level, message, detail) {
        var entry = {
          time: new Date().toLocaleTimeString(),
          level: level,
          message: message,
          detail: detail ? String(detail).slice(0, 220) : ""
        };
        window.__wpLog.push(entry);
        window.__wpLog = window.__wpLog.slice(-8);
        var box = document.getElementById("debugPanel");
        var lines = document.getElementById("debugLines");
        var badge = document.getElementById("debugBadge");
        if (badge) badge.textContent = level === "error" ? "Ошибка" : "Диагностика";
        if (box && level === "error") box.classList.add("is-error");
        if (lines) {
          lines.innerHTML = window.__wpLog
            .map(function (item) {
              return "<div><strong>" + item.time + " " + item.level + "</strong> " + item.message + (item.detail ? "<br><span>" + item.detail + "</span>" : "") + "</div>";
            })
            .join("");
        }
      };
      window.onerror = function (message, source, lineno, colno, error) {
        window.__wpPushLog("error", "JS error " + lineno + ":" + colno, message || (error && error.stack));
      };
      window.onunhandledrejection = function (event) {
        window.__wpPushLog("error", "Promise error", event.reason && (event.reason.stack || event.reason.message || event.reason));
      };
      window.__wpPushLog("info", "HTML loaded " + window.__WP_VERSION__);
    </script>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Главная навигация">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">WP</div>
          <div>
            <strong>WP Service</strong>
            <span>мастера, клиенты, доверие</span>
          </div>
        </div>

        <nav class="nav-list" id="navList"></nav>

        <div class="sidebar-card">
          <span class="eyebrow">MVP режим</span>
          <p>Данные хранятся локально в браузере. Backend подключается следующим этапом.</p>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="todayLabel">WP Service</p>
            <h1 id="pageTitle">Панель</h1>
          </div>

          <div class="topbar-actions">
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему">
              <span id="themeIcon">☀</span>
              <strong id="themeLabel">Светлая</strong>
            </button>

            <button class="ghost-button auth-button" id="authButton" type="button">Войти</button>

            <div class="server-clock" aria-label="Серверное время">
              <span>Время платформы</span>
              <strong id="serverClock">--:--:--</strong>
            </div>

            <label class="role-switch">
              <span>Роль</span>
              <select id="roleSelect">
                <option value="client">Клиент</option>
                <option value="master">Мастер</option>
                <option value="store">Магазин</option>
                <option value="support">Поддержка</option>
                <option value="admin">Админ</option>
              </select>
            </label>
          </div>
        </header>

        <section class="user-strip" id="userStrip"></section>
        <section class="content-grid" id="appRoot" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="appDialog">
      <div class="dialog-header">
        <strong id="dialogTitle">Действие</strong>
        <button class="icon-button" data-close-dialog aria-label="Закрыть">X</button>
      </div>
      <div id="dialogBody"></div>
    </dialog>

    <aside class="debug-panel" id="debugPanel" aria-live="polite">
      <div class="debug-head">
        <strong id="debugBadge">Диагностика</strong>
        <button class="debug-toggle" id="debugToggle" type="button">Логи</button>
      </div>
      <div class="debug-lines" id="debugLines"></div>
      <div class="debug-actions">
        <button type="button" id="debugReset">Сброс cache</button>
        <a href="./app.js?v=5" target="_blank" rel="noreferrer">JS</a>
        <a href="./api/bootstrap" target="_blank" rel="noreferrer">API</a>
      </div>
    </aside>

    <script src="./app.js?v=5"></script>
  </body>
</html>
