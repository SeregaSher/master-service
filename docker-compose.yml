services:
  postgres:
    image: postgres:16-alpine
    container_name: master_service_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wpservice}
      POSTGRES_USER: ${POSTGRES_USER:-wpservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wpservice}
    volumes:
      - master_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wpservice} -d ${POSTGRES_DB:-wpservice}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: master_service_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wpservice}:${POSTGRES_PASSWORD:-wpservice}@postgres:5432/${POSTGRES_DB:-wpservice}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
    ports:
      - "${MASTER_API_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  master_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: master_service_web
    restart: unless-stopped
    ports:
      - "${MASTER_WEB_PORT:-3010}:80"
    depends_on:
      - backend

volumes:
  master_service_postgres_data:
